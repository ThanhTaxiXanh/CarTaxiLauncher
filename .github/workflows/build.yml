name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check signing secret
        shell: bash
        env:
          CARTAXI_KEYSTORE_PASSWORD: ${{ secrets.CARTAXI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CARTAXI_KEYSTORE_PASSWORD" ]; then
            echo "::error::Thieu secret CARTAXI_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ ${#CARTAXI_KEYSTORE_PASSWORD} -lt 16 ]; then
            echo "::error::CARTAXI_KEYSTORE_PASSWORD qua ngan, can it nhat 16 ky tu"
            exit 1
          fi
      - name: Create signing key (first run only)
        shell: bash
        env:
          CARTAXI_KEYSTORE_PASSWORD: ${{ secrets.CARTAXI_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f signing/cartaxi-release.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/cartaxi-release.p12 -storetype PKCS12 \
              -storepass "$CARTAXI_KEYSTORE_PASSWORD" -keypass "$CARTAXI_KEYSTORE_PASSWORD" -alias cartaxi \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=CarTaxiLauncher, O=ThanhTaxiXanh, C=VN"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
      - name: Save signing key to repo
        if: env.NEW_KEY == '1'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add signing/cartaxi-release.p12
          git commit -m "Add signing key"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        shell: bash
        env:
          CARTAXI_KEYSTORE_PASSWORD: ${{ secrets.CARTAXI_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | sed 's#file:///home/runner/work/CarTaxiLauncher/CarTaxiLauncher/##' | head -20 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
