name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a signed release only after signing migration is verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build development APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Audit historical release APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          for release in 1 71; do
            apk="$RUNNER_TEMP/cartaxi-build-${release}.apk"
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/ThanhTaxiXanh/CarTaxiLauncher/releases/download/build-${release}/app-debug.apk" -o "$apk"
            test -s "$apk"
            echo "--- Signing certificate for build-${release} ---"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate SHA-256 digest|Signer #1 certificate DN'
            rm -f "$apk"
          done

      - name: Verify existing PKCS12 unlocks with KEYTHANHTAXIXANH and matches build-71
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYTHANHTAXIXANH }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::GitHub Actions secret KEYTHANHTAXIXANH is not configured'
            exit 1
          fi
          key_file="$RUNNER_TEMP/check-original-signing.p12"
          apk="$RUNNER_TEMP/cartaxi-original-build-71.apk"
          trap 'rm -f "$key_file" "$apk"' EXIT
          # Retrieve only the historical tracked keystore; never print/store as an artifact.
          git fetch --no-tags --depth=1 origin main
          git show origin/main:signing/cartaxi-release.p12 > "$key_file"
          chmod 600 "$key_file"
          if ! keytool -list -storetype PKCS12 -keystore "$key_file" -storepass "$KEYSTORE_PASSWORD" -alias cartaxi >/dev/null 2>&1; then
            echo '::error::KEYTHANHTAXIXANH cannot unlock the historical cartaxi-release.p12 / alias cartaxi'
            exit 1
          fi
          echo 'PASS: KEYTHANHTAXIXANH unlocks historical PKCS12 keystore.'
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/ThanhTaxiXanh/CarTaxiLauncher/releases/download/build-71/app-debug.apk -o "$apk"
          expected=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          actual=$(keytool -exportcert -rfc -storetype PKCS12 -keystore "$key_file" -storepass "$KEYSTORE_PASSWORD" -alias cartaxi 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$expected" || -z "$actual" || "$expected" != "$actual" ]]; then
            echo '::error::Keystore unlocks, but its signing certificate does NOT match build-71. Do NOT use this key for an in-place update.'
            exit 1
          fi
          echo 'PASS: Keystore signing certificate matches build-71; can preserve Android update compatibility.'


  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and validate signing key
        shell: bash
        env:
          CARTAXI_KEYSTORE_BASE64: ${{ secrets.CARTAXI_KEYSTORE_BASE64 }}
          CARTAXI_KEYSTORE_PASSWORD: ${{ secrets.KEYTHANHTAXIXANH }}
          CARTAXI_SIGNING_CERT_SHA256: ${{ vars.CARTAXI_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$CARTAXI_KEYSTORE_BASE64" || -z "$CARTAXI_KEYSTORE_PASSWORD" || -z "$CARTAXI_SIGNING_CERT_SHA256" ]]; then
            echo '::error::Configure CARTAXI_KEYSTORE_BASE64, KEYTHANHTAXIXANH and CARTAXI_SIGNING_CERT_SHA256 first'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cartaxi-signing"
          chmod 700 "$RUNNER_TEMP/cartaxi-signing"
          printf '%s' "$CARTAXI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cartaxi-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/cartaxi-signing/release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/cartaxi-signing/release.p12" -storepass "$CARTAXI_KEYSTORE_PASSWORD" -alias cartaxi >/dev/null
          actual=$(keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/cartaxi-signing/release.p12" -storepass "$CARTAXI_KEYSTORE_PASSWORD" -alias cartaxi | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          expected=$(printf '%s' "$CARTAXI_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Signing certificate does not match the approved installed-APK certificate'
            exit 1
          fi
      - name: Build signed release APK
        env:
          CARTAXI_KEYSTORE_FILE: ${{ runner.temp }}/cartaxi-signing/release.p12
          CARTAXI_KEYSTORE_PASSWORD: ${{ secrets.KEYTHANHTAXIXANH }}
        run: gradle :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK signature and file
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/cartaxi-signing"
