name: Apply patch
on:
  push:
    branches: [apply-patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch onto new branch
        shell: bash
        run: |
          git fetch origin apply-patch
          git show origin/apply-patch:fix-android13-baseline.patch > /tmp/fix.patch
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b fix/android13-baseline
          git apply --index /tmp/fix.patch
          git commit -m "Android 13 baseline fixes (patch)"
          git push origin fix/android13-baseline
