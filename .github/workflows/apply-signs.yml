name: Apply signs patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          D=app/src/main/java/com/cartaxi/launcher
          for f in apply_signs.py RoadSigns.kt; do
            if [ -f "$D/$f" ]; then mv "$D/$f" .; fi
          done
          ls apply_signs.py RoadSigns.kt
          python3 apply_signs.py
          rm -f apply_signs.py RoadSigns.kt
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add traffic signs and speed limit"
          git push
